---
id: acme-web
info:
  name: Acme Gateway
  metadata:
    vendor: Acme
    product: acme-gateway
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: word
    words:
    - Acme Gateway
    - Acme Console
    case-insensitive: true
  - type: word
    words:
    - 'server: acme'
    part: header
  - type: favicon
    hash:
    - f49c4a4bde1eec6c0b80c2277c76e3db
---
id: acme-tcp
info:
  name: Acme TCP Server
  metadata:
    vendor: Acme
    product: acme-tcp
tcp:
- inputs:
  - data: ping
  port: 9000
  extractors:
  - type: regex
    regex:
    - '^ACME/[0-9.]+$'
---
id: unsupported-rule
info:
  name: Unsupported Rule
http:
- matchers:
  - type: word
    words:
    - should-not-import
    negative: true
  - type: dsl
    dsl:
    - status_code == 200
  - type: word
    words:
    - should-not-import-either
    condition: xor
