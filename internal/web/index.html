<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yscan CAASM</title>
  <style>
    :root {
      --canvas: #f4f7f5;
      --surface: #ffffff;
      --ink: #18221d;
      --muted: #66736c;
      --line: #d8e1da;
      --accent: #087b5b;
      --accent-soft: #dff4e9;
      --warn: #a35b00;
      --warn-soft: #fff2d9;
      --danger: #b42318;
      --danger-soft: #fde8e6;
      --shadow: 0 14px 36px rgba(33, 54, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      background-color: var(--canvas);
      background-image: linear-gradient(rgba(24, 34, 29, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(24, 34, 29, .035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    button, input, select { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
    .sidebar { padding: 24px 16px; border-right: 1px solid var(--line); background: rgba(255,255,255,.82); display: flex; flex-direction: column; gap: 28px; }
    .brand { padding: 0 10px; display: grid; gap: 4px; }
    .brand strong { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; font-size: 22px; font-weight: 700; }
    .brand span { color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 6px; }
    .nav a { color: var(--muted); text-decoration: none; padding: 10px 11px; border-left: 3px solid transparent; font-size: 14px; }
    .nav a:hover, .nav a.active { color: var(--ink); border-left-color: var(--accent); background: var(--accent-soft); }
    .sidebar-footer { margin-top: auto; padding: 10px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 52px) 48px; }
    .page-header { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: 0; }
    .subtle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .status-line { min-height: 20px; color: var(--muted); font-size: 13px; }
    .stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .stat { padding: 14px 16px; border-right: 1px solid var(--line); min-height: 82px; }
    .stat:last-child { border-right: 0; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 22px; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 20px; align-items: start; }
    .panel { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .panel-heading h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .panel-heading > select { width: auto; min-width: 0; max-width: 620px; flex: 1; }
    .panel-body { padding: 16px; }
    .form-grid { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, select { width: 100%; min-height: 36px; border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; color: var(--ink); background: #fbfdfb; }
    input:focus, select:focus { outline: 2px solid rgba(8,123,91,.22); border-color: var(--accent); }
    .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
    .check input { width: 15px; min-height: 15px; }
    .button { min-height: 34px; border: 1px solid var(--accent); border-radius: 3px; padding: 6px 11px; color: #fff; background: var(--accent); cursor: pointer; }
    .button:hover { filter: brightness(.93); }
    .button.secondary { color: var(--ink); border-color: var(--line); background: #fff; }
    .button.danger { color: var(--danger); border-color: #efc4bf; background: #fff; }
    .button:disabled { opacity: .55; cursor: not-allowed; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f3faf6; }
    .badge { display: inline-block; padding: 3px 7px; border-radius: 999px; background: #edf1ee; color: #526158; font-size: 11px; }
    .badge.success { color: var(--accent); background: var(--accent-soft); }
    .badge.failed, .badge.canceled { color: var(--danger); background: var(--danger-soft); }
    .badge.running { color: var(--warn); background: var(--warn-soft); }
    .detail { display: grid; gap: 14px; font-size: 13px; }
    .detail dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; overflow-wrap: anywhere; }
    .empty { padding: 30px 16px; color: var(--muted); font-size: 13px; text-align: center; }
    .report-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .72fr); gap: 20px; }
    .markdown { margin: 0; min-height: 440px; overflow: auto; padding: 16px; color: #26332c; background: #fbfdfb; border: 0; font-family: "IBM Plex Mono", "SFMono-Regular", monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
    .finding { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .finding:last-child { border-bottom: 0; }
    .finding strong { overflow-wrap: anywhere; }
    .finding small { color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 2; flex-direction: row; align-items: center; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); gap: 20px; }
      .brand { padding: 0; }
      .brand span, .sidebar-footer { display: none; }
      .nav { grid-auto-flow: column; gap: 2px; }
      .nav a { padding: 7px 8px; border-left: 0; border-bottom: 2px solid transparent; font-size: 12px; }
      .nav a:hover, .nav a.active { border-left-color: transparent; border-bottom-color: var(--accent); }
      main { padding: 20px 14px 32px; }
      .split, .report-grid { grid-template-columns: 1fr; }
      .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><strong>yscan</strong><span>Internal CAASM Console</span></div>
      <nav class="nav" aria-label="Console navigation">
        <a href="/tasks" data-route="/tasks">任务</a>
        <a href="/assets" data-route="/assets">资产</a>
        <a href="/reports" data-route="/reports">漏洞与报告</a>
      </nav>
      <div class="sidebar-footer">LOCAL / SQLITE / INCREMENTAL</div>
    </aside>
    <main id="app" aria-live="polite"></main>
  </div>
  <script>
    const app = document.getElementById('app');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const time = value => value ? new Date(value.replace(' ', 'T') + (value.endsWith('Z') ? '' : 'Z')).toLocaleString() : '-';
    const status = value => `<span class="badge ${esc(value)}">${esc(value || '-')}</span>`;
    async function request(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) { throw new Error((await response.text()) || `HTTP ${response.status}`); }
      const type = response.headers.get('content-type') || '';
      return type.includes('application/json') ? response.json() : response.text();
    }
    function setActiveNav() {
      document.querySelectorAll('.nav a').forEach(link => link.classList.toggle('active', link.dataset.route === location.pathname));
    }
    function shell(title, caption, content) {
      app.innerHTML = `<header class="page-header"><div><h1>${title}</h1><p class="subtle">${caption}</p></div><div class="status-line" id="status-line"></div></header>${content}`;
      setActiveNav();
    }
    function message(value, error = false) {
      const node = document.getElementById('status-line');
      if (node) { node.textContent = value; node.style.color = error ? 'var(--danger)' : 'var(--muted)'; }
    }
    function typeForForm(type, vuln) {
      if (!vuln) return type;
      if (type === 'scan_subnet') return 'scan_subnet_vuln';
      if (type === 'scan_ip') return 'scan_ip_vuln';
      return type;
    }
    function renderTaskStats(tasks) {
      const counts = {all: tasks.length, running: 0, success: 0, failed: 0};
      tasks.forEach(task => { if (task.status in counts) counts[task.status]++; });
      return `<div class="stat-row"><div class="stat"><span>任务总数</span><strong>${counts.all}</strong></div><div class="stat"><span>运行中</span><strong>${counts.running}</strong></div><div class="stat"><span>已完成</span><strong>${counts.success}</strong></div><div class="stat"><span>失败或取消</span><strong>${counts.failed + tasks.filter(t => t.status === 'canceled').length}</strong></div></div>`;
    }
    async function renderTasks() {
      shell('任务', '创建扫描任务并查看执行状态', '<div class="empty">正在加载任务...</div>');
      try {
        const tasks = await request('/api/tasks');
        shell('任务', '创建扫描任务并查看执行状态', `${renderTaskStats(tasks)}<div class="split"><section class="panel"><div class="panel-heading"><h2>任务列表</h2><button class="button secondary" id="refresh-tasks">刷新</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>状态</th><th>类型</th><th>目标</th><th>进度</th><th>创建时间</th></tr></thead><tbody>${tasks.map(task => `<tr data-task-id="${task.id}"><td>${task.id}</td><td>${status(task.status)}</td><td>${esc(task.task_type)}</td><td>${esc(task.target)}</td><td>${task.progress}%</td><td>${time(task.created_at)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">暂无任务</td></tr>'}</tbody></table></div></section><aside class="panel"><div class="panel-heading"><h2>新建任务</h2></div><form class="panel-body form-grid" id="task-form"><label>类型<select name="type"><option value="scan_subnet">网段扫描</option><option value="scan_ip">单 IP 扫描</option><option value="collect_domain">域名收集</option></select></label><label>目标<input name="target" placeholder="192.168.10.0/24" required></label><label class="check"><input type="checkbox" name="vuln">启用漏洞验证</label><button class="button" type="submit">创建任务</button></form></aside></div>`);
        document.getElementById('refresh-tasks').onclick = renderTasks;
        document.querySelectorAll('[data-task-id]').forEach(row => row.onclick = () => showTaskDetail(row.dataset.taskId));
        document.getElementById('task-form').onsubmit = async event => {
          event.preventDefault(); const form = new FormData(event.currentTarget);
          try { const task = await request('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:typeForForm(form.get('type'), form.get('vuln') === 'on'), target:form.get('target')})}); message(`任务 #${task.task_id} 已创建`); setTimeout(renderTasks, 450); } catch (error) { message(error.message, true); }
        };
      } catch (error) { shell('任务', '创建扫描任务并查看执行状态', `<div class="empty">${esc(error.message)}</div>`); }
    }
    async function showTaskDetail(id) {
      try { const task = await request(`/api/tasks/${id}`); const host = document.querySelector('.split aside'); if (!host) return; host.innerHTML = `<div class="panel-heading"><h2>任务 #${task.id}</h2></div><div class="panel-body detail"><dl><dt>状态</dt><dd>${status(task.status)}</dd><dt>类型</dt><dd>${esc(task.task_type)}</dd><dt>目标</dt><dd>${esc(task.target)}</dd><dt>进度</dt><dd>${task.progress}%</dd><dt>错误</dt><dd>${esc(task.error_msg || '-')}</dd></dl>${['queued','running'].includes(task.status) ? `<button class="button danger" id="cancel-task">取消任务</button>` : ''}</div>`; const cancel = document.getElementById('cancel-task'); if (cancel) cancel.onclick = async () => { await request(`/api/tasks/${id}/cancel`, {method:'POST'}); renderTasks(); }; } catch (error) { message(error.message, true); }
    }
    async function renderAssets() {
      shell('资产', '查看存活主机、关键端口和服务画像', '<div class="empty">正在加载资产...</div>');
      try {
        const assets = await request('/api/assets?active=true');
        shell('资产', '查看存活主机、关键端口和服务画像', `<div class="split"><section class="panel"><div class="panel-heading"><h2>存活资产</h2><button class="button secondary" id="refresh-assets">刷新</button></div><div class="table-wrap"><table><thead><tr><th>IP</th><th>来源</th><th>首次发现</th><th>最后发现</th><th>状态</th></tr></thead><tbody>${assets.map(asset => `<tr data-asset-ip="${esc(asset.ip)}"><td>${esc(asset.ip)}</td><td>${esc(asset.source)}</td><td>${time(asset.first_seen)}</td><td>${time(asset.last_seen)}</td><td>${status(asset.is_active ? 'success' : 'inactive')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">暂无资产</td></tr>'}</tbody></table></div></section><aside class="panel"><div class="panel-heading"><h2>资产详情</h2></div><div class="panel-body empty" id="asset-detail">选择一条资产查看端口和服务。</div></aside></div>`);
        document.getElementById('refresh-assets').onclick = renderAssets;
        document.querySelectorAll('[data-asset-ip]').forEach(row => row.onclick = () => showAssetDetail(row.dataset.assetIp));
      } catch (error) { shell('资产', '查看存活主机、关键端口和服务画像', `<div class="empty">${esc(error.message)}</div>`); }
    }
    async function showAssetDetail(ip) {
      try { const asset = await request(`/api/assets/${encodeURIComponent(ip)}`); const host = document.getElementById('asset-detail'); host.className = 'panel-body detail'; host.innerHTML = `<dl><dt>IP</dt><dd>${esc(asset.host.ip)}</dd><dt>来源</dt><dd>${esc(asset.host.source)}</dd><dt>状态</dt><dd>${status(asset.host.is_active ? 'success' : 'inactive')}</dd></dl><div class="table-wrap"><table><thead><tr><th>端口</th><th>服务</th><th>最后发现</th></tr></thead><tbody>${asset.ports.map(port => `<tr><td>${port.port}</td><td>${esc(port.service)}</td><td>${time(port.last_seen_at)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">暂无端口结果</td></tr>'}</tbody></table></div>`; } catch (error) { message(error.message, true); }
    }
    async function renderReports() {
      shell('漏洞与报告', '查看任务变化、漏洞结果和 Markdown 报告', '<div class="empty">正在加载任务...</div>');
      try {
        const tasks = await request('/api/tasks');
        shell('漏洞与报告', '查看任务变化、漏洞结果和 Markdown 报告', `<section class="panel"><div class="panel-heading"><h2>任务结果</h2><select id="report-task">${tasks.map(task => `<option value="${task.id}">#${task.id} ${esc(task.task_type)} · ${esc(task.target)}</option>`).join('')}</select></div></section><div class="report-grid" style="margin-top:20px"><section class="panel"><div class="panel-heading"><h2>Markdown 报告</h2></div><pre class="markdown" id="markdown-report">选择任务查看报告。</pre></section><section class="panel"><div class="panel-heading"><h2>漏洞结果</h2></div><div class="panel-body" id="finding-list"></div></section></div>`);
        const select = document.getElementById('report-task'); if (select && tasks.length) { select.onchange = () => loadReport(select.value); loadReport(select.value); }
      } catch (error) { shell('漏洞与报告', '查看任务变化、漏洞结果和 Markdown 报告', `<div class="empty">${esc(error.message)}</div>`); }
    }
    async function loadReport(id) {
      const report = document.getElementById('markdown-report'); const findings = document.getElementById('finding-list'); report.textContent = '正在加载...'; findings.innerHTML = '';
      try { report.textContent = await request(`/api/tasks/${id}/report`); } catch (error) { report.textContent = `报告不可用\n${error.message}`; }
      try { const data = await request(`/api/tasks/${id}/findings`); findings.innerHTML = data.map(finding => `<div class="finding"><span class="badge ${esc(finding.severity)}">${esc(finding.severity || 'info')}</span><div><strong>${esc(finding.name || finding.template_id)}</strong><small>${esc(finding.target || finding.target_ip)} · ${esc(finding.template_id)}</small></div></div>`).join('') || '<div class="empty">暂无漏洞结果</div>'; } catch (error) { findings.innerHTML = `<div class="empty">${esc(error.message)}</div>`; }
    }
    function route() { ({'/assets':renderAssets, '/reports':renderReports, '/tasks':renderTasks}[location.pathname] || renderTasks)(); }
    document.addEventListener('click', event => { const link = event.target.closest('a[data-route]'); if (link) { event.preventDefault(); history.pushState({}, '', link.href); route(); } });
    window.addEventListener('popstate', route); route();
  </script>
</body>
</html>
