<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>yscan CAASM</title>
  <style>
    :root {
      --canvas: #f4f7f5;
      --surface: #ffffff;
      --ink: #18221d;
      --muted: #66736c;
      --line: #d8e1da;
      --accent: #087b5b;
      --accent-soft: #dff4e9;
      --warn: #a35b00;
      --warn-soft: #fff2d9;
      --danger: #b42318;
      --danger-soft: #fde8e6;
      --shadow: 0 14px 36px rgba(33, 54, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      background-color: var(--canvas);
      background-image: linear-gradient(rgba(24, 34, 29, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(24, 34, 29, .035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    button, input, select { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
    .sidebar { padding: 24px 16px; border-right: 1px solid var(--line); background: rgba(255,255,255,.82); display: flex; flex-direction: column; gap: 28px; }
    .brand { padding: 0 10px; display: grid; gap: 4px; }
    .brand strong { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; font-size: 22px; font-weight: 700; }
    .brand span { color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 6px; }
    .nav a { color: var(--muted); text-decoration: none; padding: 10px 11px; border-left: 3px solid transparent; font-size: 14px; }
    .nav a:hover, .nav a.active { color: var(--ink); border-left-color: var(--accent); background: var(--accent-soft); }
    .sidebar-footer { margin-top: auto; padding: 10px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 52px) 48px; }
    .page-header { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: 0; }
    .subtle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .status-line { min-height: 20px; color: var(--muted); font-size: 13px; }
    .stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .stat { padding: 14px 16px; border-right: 1px solid var(--line); min-height: 82px; }
    .stat:last-child { border-right: 0; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 22px; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 20px; align-items: start; }
    .panel { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .panel-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .panel-heading h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .panel-heading > select { width: auto; min-width: 0; max-width: 620px; flex: 1; }
    .panel-heading > input { width: auto; min-width: 120px; max-width: 220px; flex: 1 1 140px; }
    .rule-toolbar { flex-wrap: wrap; justify-content: flex-start; }
    .rule-toolbar h2 { margin-right: auto; }
    .rule-toolbar > select, .rule-toolbar > input { width: auto; min-width: 120px; max-width: 220px; flex: 1 1 140px; }
    .panel-body { padding: 16px; }
    .form-grid { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, select { width: 100%; min-height: 36px; border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; color: var(--ink); background: #fbfdfb; }
    input:focus, select:focus { outline: 2px solid rgba(8,123,91,.22); border-color: var(--accent); }
    .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
    .check input { width: 15px; min-height: 15px; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .segmented { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .segmented label { display: block; color: var(--ink); cursor: pointer; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented span { display: block; min-height: 34px; border: 1px solid var(--line); border-radius: 3px; padding: 8px; text-align: center; background: #fbfdfb; }
    .segmented input:checked + span { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .hidden { display: none !important; }
    .section-note { margin: 0; color: var(--muted); font-size: 12px; }
    .port-policy { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 8px; }
    .port-policy input[readonly] { color: var(--muted); background: #f2f5f3; }
    .change-grid { display: grid; gap: 10px; }
    .change-group { border-top: 1px solid var(--line); padding-top: 10px; }
    .change-group:first-child { border-top: 0; padding-top: 0; }
    .change-group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 650; }
    .change-list { margin: 0; padding-left: 18px; color: var(--muted); font-family: "IBM Plex Mono", "SFMono-Regular", monospace; font-size: 11px; line-height: 1.6; }
    .change-list li { overflow-wrap: anywhere; }
    .button { min-height: 34px; border: 1px solid var(--accent); border-radius: 3px; padding: 6px 11px; color: #fff; background: var(--accent); cursor: pointer; }
    .button:hover { filter: brightness(.93); }
    .button.secondary { color: var(--ink); border-color: var(--line); background: #fff; }
    .button.danger { color: var(--danger); border-color: #efc4bf; background: #fff; }
    .button:disabled { opacity: .55; cursor: not-allowed; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f3faf6; }
    .badge { display: inline-block; padding: 3px 7px; border-radius: 999px; background: #edf1ee; color: #526158; font-size: 11px; }
    .badge.success { color: var(--accent); background: var(--accent-soft); }
    .badge.failed, .badge.canceled { color: var(--danger); background: var(--danger-soft); }
    .badge.running { color: var(--warn); background: var(--warn-soft); }
    .detail { display: grid; gap: 14px; font-size: 13px; }
    .detail dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; overflow-wrap: anywhere; }
    .empty { padding: 30px 16px; color: var(--muted); font-size: 13px; text-align: center; }
    .report-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .72fr); gap: 20px; }
    .report-toolbar { align-items: stretch; }
    .report-picker-grid { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px; }
    .search-picker { min-width: 0; display: grid; gap: 6px; }
    .picker-selection { min-height: 20px; color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
    .picker-results { max-height: 210px; overflow-y: auto; border: 1px solid var(--line); background: #fff; }
    .picker-option { width: 100%; display: grid; gap: 3px; border: 0; border-bottom: 1px solid var(--line); padding: 9px 10px; color: var(--ink); background: #fff; text-align: left; cursor: pointer; }
    .picker-option:last-child { border-bottom: 0; }
    .picker-option:hover, .picker-option:focus, .picker-option.selected { outline: 0; background: var(--accent-soft); }
    .picker-option strong { font-size: 12px; overflow-wrap: anywhere; }
    .picker-option span { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .report-mode { display: flex; flex-wrap: wrap; gap: 8px; }
    .report-mode .button[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
    .markdown { min-height: 440px; overflow: auto; padding: 18px; color: #26332c; background: #fbfdfb; font-size: 13px; line-height: 1.65; }
    .markdown > :first-child { margin-top: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 { margin: 1.25em 0 .55em; font-weight: 650; letter-spacing: 0; }
    .markdown h1 { font-size: 21px; }
    .markdown h2 { font-size: 17px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .markdown h3 { font-size: 14px; }
    .markdown p { margin: .65em 0; overflow-wrap: anywhere; }
    .markdown ul, .markdown ol { margin: .65em 0; padding-left: 24px; }
    .markdown code { padding: 2px 4px; background: #edf1ee; font: 11px/1.5 "IBM Plex Mono", "SFMono-Regular", monospace; }
    .markdown pre { overflow: auto; margin: .8em 0; padding: 12px; border: 1px solid var(--line); background: #f1f5f2; }
    .markdown pre code { padding: 0; background: transparent; white-space: pre; }
    .markdown-table { max-width: 100%; overflow-x: auto; margin: .8em 0; border: 1px solid var(--line); }
    .markdown-table th, .markdown-table td { white-space: normal; vertical-align: top; overflow-wrap: anywhere; }
    .finding { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .finding:last-child { border-bottom: 0; }
    .finding strong { overflow-wrap: anywhere; }
    .finding small { color: var(--muted); overflow-wrap: anywhere; }
    .fingerprint-stack { display: grid; gap: 20px; }
    .rule-raw { margin: 8px 0 0; max-width: 760px; max-height: 220px; overflow: auto; padding: 10px; border: 1px solid var(--line); background: #f8faf8; color: #304038; font: 11px/1.55 "IBM Plex Mono", "SFMono-Regular", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .evidence-list { display: grid; gap: 4px; min-width: 300px; color: var(--muted); font: 11px/1.45 "IBM Plex Mono", "SFMono-Regular", monospace; white-space: normal; overflow-wrap: anywhere; }
    .asset-split { grid-template-columns: 380px minmax(0, 1fr); }
    .asset-split > * { min-width: 0; }
    .asset-nav-search { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .asset-list { display: grid; max-height: calc(100vh - 260px); overflow-y: auto; }
    .asset-row { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; color: var(--ink); background: #fff; text-align: left; cursor: pointer; }
    .asset-row:hover, .asset-row:focus { outline: 0; background: #f3faf6; }
    .asset-row strong { display: block; font: 13px/1.4 "IBM Plex Mono", "SFMono-Regular", monospace; }
    .asset-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .asset-endpoints { display: grid; gap: 12px; }
    .endpoint-profile { border: 1px solid var(--line); border-radius: 6px; background: #fbfdfb; }
    .endpoint-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .endpoint-heading strong { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; }
    .endpoint-heading span { color: var(--muted); font-size: 12px; text-align: right; }
    .endpoint-body { display: grid; gap: 12px; padding: 12px 13px; }
    .endpoint-section { display: grid; gap: 6px; }
    .endpoint-section h3 { margin: 0; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .technology-list { display: grid; gap: 6px; }
    .technology-row { display: grid; grid-template-columns: minmax(100px, .7fr) minmax(0, 1.3fr); gap: 8px 12px; padding-top: 6px; border-top: 1px solid var(--line); }
    .technology-row:first-child { padding-top: 0; border-top: 0; }
    .technology-row > strong { font-size: 12px; }
    .technology-row > div { min-width: 0; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .endpoint-evidence { color: var(--muted); font: 11px/1.55 "IBM Plex Mono", "SFMono-Regular", monospace; overflow-wrap: anywhere; }
    .endpoint-evidence details summary { cursor: pointer; color: var(--ink); font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif; }
    .reason-list { margin: 0; padding-left: 18px; color: var(--warn); font-size: 12px; line-height: 1.55; }
	    .mono { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; font-size: 11px; }
	    progress { width: 100%; height: 9px; accent-color: var(--accent); }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { min-width: 0; position: sticky; top: 0; z-index: 2; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); gap: 20px; }
      .brand { padding: 0; }
      .brand span, .sidebar-footer { display: none; }
      .nav { min-width: max-content; grid-auto-flow: column; gap: 2px; }
      .nav a { padding: 7px 8px; border-left: 0; border-bottom: 2px solid transparent; font-size: 12px; }
      .nav a:hover, .nav a.active { border-left-color: transparent; border-bottom-color: var(--accent); }
      main { padding: 20px 14px 32px; }
      .split, .report-grid, .asset-split { grid-template-columns: 1fr; }
      .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 560px) {
      .page-header { display: grid; }
      .panel-heading { align-items: stretch; }
      .panel-heading > .toolbar, .report-mode { width: 100%; }
      .report-picker-grid, .port-policy { grid-template-columns: minmax(0, 1fr); }
      .report-mode .button { flex: 1 1 130px; }
      .markdown { min-height: 320px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><strong>yscan</strong><span>Internal CAASM Console</span></div>
      <nav class="nav" aria-label="Console navigation">
        <a href="/tasks" data-route="/tasks">持续任务</a>
        <a href="/executions" data-route="/executions">即时执行</a>
        <a href="/assets" data-route="/assets">资产</a>
		<a href="/fingerprints" data-route="/fingerprints">指纹库</a>
        <a href="/reports" data-route="/reports">漏洞与报告</a>
      </nav>
      <div class="sidebar-footer">LOCAL / SQLITE / INCREMENTAL</div>
    </aside>
    <main id="app" aria-live="polite"></main>
  </div>
  <script>
    const app = document.getElementById('app');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const time = value => value ? new Date(value.replace(' ', 'T') + (value.endsWith('Z') ? '' : 'Z')).toLocaleString() : '-';
    const status = value => `<span class="badge ${esc(value)}">${esc(value || '-')}</span>`;
	    const baselinePortSpec = '21-23,25,53,80,88,110-111,135,139,143,161,389,443,445,464-465,500,587,636,873,902,912,993,995,1433,1521,2049,2181,2375-2376,3306,3389,4369,5432,5601,5672,5900,5984-5986,6379,6443,7001,8080,8443,8888,9090,9200,9300,11211,27017';
	    const portPresets = {
	      important: '22,80,443,3389,8080,8443',
	      web: '80-82,443,8000,8008,8080-8081,8443,8888,9000,9090',
	      services: '21-23,25,53,110-111,135,139,143,389,443,445,465,587,636,873,993,995,2049,3389,5900,5985-5986',
	      data: '1433,1521,2181,2375-2376,3306,4369,5432,5601,5672,5984,6379,7001,8080,9090,9200,9300,11211,27017',
	      full: '1-65535'
	    };
	    function portPresetValue(name, scanType) { return name === 'default' ? (scanType === 'ip' ? portPresets.full : baselinePortSpec) : (portPresets[name] || ''); }
	    function portPresetFor(portSpec, scanType) {
	      if (!portSpec) return 'default';
	      return Object.keys(portPresets).find(name => portPresets[name] === portSpec) || 'custom';
	    }
	    function portPolicyControl(scanType, portSpec = '') {
	      const preset = portPresetFor(portSpec, scanType), value = portSpec || portPresetValue('default', scanType);
	      const options = [['default','默认策略'],['important','重要端口'],['web','Web 常见端口'],['services','基础服务端口'],['data','数据库与中间件'],['full','全端口'],['custom','自定义']];
	      return `<label>端口策略<div class="port-policy"><select name="port_preset" aria-label="端口策略预设">${options.map(([key,label]) => `<option value="${key}"${preset === key ? ' selected' : ''}>${label}</option>`).join('')}</select><input name="port_spec" value="${esc(value)}" aria-label="端口表达式"${preset === 'custom' ? '' : ' readonly'} required></div></label>`;
	    }
	    function bindPortPolicy(form) {
	      const preset = form.elements.port_preset, input = form.elements.port_spec, scanType = form.elements.scan_type;
	      if (!preset || !input || !scanType) return;
	      const apply = () => { const custom = preset.value === 'custom'; input.readOnly = !custom; if (!custom) input.value = portPresetValue(preset.value, scanType.value); };
	      preset.onchange = apply;
	      scanType.addEventListener('change', () => { if (preset.value === 'default') apply(); });
	      apply();
	    }
	    function submittedPortSpec(values) { return values.get('port_preset') === 'default' ? '' : String(values.get('port_spec') || '').trim(); }
	    function markdownInline(value) {
	      return String(value ?? '').split(/(`[^`]*`)/g).map(part => {
	        if (part.startsWith('`') && part.endsWith('`')) return `<code>${esc(part.slice(1, -1))}</code>`;
	        return esc(part).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
	      }).join('');
	    }
	    function markdownCells(line) {
	      const trimmed = line.trim().replace(/^\|/, '').replace(/\|$/, '');
	      const cells = []; let cell = '';
	      for (let index = 0; index < trimmed.length; index++) {
	        if (trimmed[index] === '\\' && trimmed[index + 1] === '|') { cell += '|'; index++; continue; }
	        if (trimmed[index] === '|') { cells.push(cell.trim()); cell = ''; continue; }
	        cell += trimmed[index];
	      }
	      cells.push(cell.trim());
	      return cells;
	    }
	    function markdownTableSeparator(line) {
	      const cells = markdownCells(line);
	      return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
	    }
	    function renderMarkdown(source) {
	      const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n'), output = [], paragraph = [], list = [];
	      let listType = '', inCode = false, code = [];
	      const flushParagraph = () => { if (paragraph.length) { output.push(`<p>${paragraph.map(markdownInline).join('<br>')}</p>`); paragraph.length = 0; } };
	      const flushList = () => { if (list.length) { output.push(`<${listType}>${list.map(item => `<li>${markdownInline(item)}</li>`).join('')}</${listType}>`); list.length = 0; listType = ''; } };
	      for (let index = 0; index < lines.length; index++) {
	        const line = lines[index];
	        if (inCode) { if (/^\s*```/.test(line)) { output.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code = []; inCode = false; } else code.push(line); continue; }
	        if (/^\s*```/.test(line)) { flushParagraph(); flushList(); inCode = true; continue; }
	        const heading = line.match(/^(#{1,6})\s+(.+)$/);
	        if (heading) { flushParagraph(); flushList(); const level = heading[1].length; output.push(`<h${level}>${markdownInline(heading[2])}</h${level}>`); continue; }
	        if (line.includes('|') && index + 1 < lines.length && markdownTableSeparator(lines[index + 1])) {
	          flushParagraph(); flushList(); const headers = markdownCells(line); index += 2; const rows = [];
	          while (index < lines.length && lines[index].includes('|') && lines[index].trim()) { rows.push(markdownCells(lines[index])); index++; }
	          index--;
	          output.push(`<div class="markdown-table"><table><thead><tr>${headers.map(cell => `<th>${markdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, cellIndex) => `<td>${markdownInline(row[cellIndex] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue;
	        }
	        const unordered = line.match(/^\s*[-*+]\s+(.+)$/), ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
	        if (unordered || ordered) { flushParagraph(); const nextType = unordered ? 'ul' : 'ol'; if (listType && listType !== nextType) flushList(); listType = nextType; list.push((unordered || ordered)[1]); continue; }
	        if (!line.trim()) { flushParagraph(); flushList(); continue; }
	        flushList(); paragraph.push(line);
	      }
	      if (inCode) output.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
	      flushParagraph(); flushList();
	      return output.join('');
	    }
	    function setMarkdownReport(content) { const host = document.getElementById('markdown-report'); if (host) host.innerHTML = renderMarkdown(content); }
    async function request(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const body = await response.text();
        let errorMessage = body || `HTTP ${response.status}`;
        try { errorMessage = JSON.parse(body).error || errorMessage; } catch (_) {}
        throw new Error(errorMessage);
      }
      const type = response.headers.get('content-type') || '';
      return type.includes('application/json') ? response.json() : response.text();
    }
    function setActiveNav() {
      document.querySelectorAll('.nav a').forEach(link => link.classList.toggle('active', link.dataset.route === location.pathname));
    }
    function shell(title, caption, content) {
      app.innerHTML = `<header class="page-header"><div><h1>${title}</h1><p class="subtle">${caption}</p></div><div class="status-line" id="status-line"></div></header>${content}`;
      setActiveNav();
    }

	        const response = port => { const evidence = port.protocol_evidence || []; const summaries = evidence.map(item => { if (item.evidence_type === 'passive_banner') return item.responded ? `TCP 被动 Banner · ${item.banner_captured_length || 0} B` : `TCP 被动 Banner · ${esc(item.outcome || 'no_response')}`; if (item.evidence_type === 'active_probe') return item.responded ? `TCP 主动 Probe ${esc(item.probe_name || '-')} · ${item.banner_captured_length || 0} B` : `TCP 主动 Probe ${esc(item.probe_name || '-')} · ${esc(item.outcome || item.diagnostic || 'no_response')}`; return item.responded ? `${String(item.protocol || '').toUpperCase()}${item.status_code ? ` ${item.status_code}` : ''}${item.server ? ` · ${esc(item.server)}` : ''}${item.title ? ` · ${esc(item.title)}` : ''} · ${item.body_captured_length || item.header_captured_length || 0} B` : `${String(item.protocol || '').toUpperCase()} · ${esc(item.outcome || 'no_response')}`; }); if (!summaries.length) return '未保存协议响应摘要'; return `<details><summary>${summaries.length} 项协议证据</summary>${summaries.map(item => `<div>${item}</div>`).join('')}</details>`; };
	        const technology = item => { const metadata = [item.version ? `版本 ${esc(item.version)}` : '', item.cpe ? esc(item.cpe) : '', (item.sources || []).length ? `来源 ${(item.sources || []).map(source => esc(source.source_key || source.source_product || '-')).join(', ')}` : '', item.product_status ? `证据状态 ${esc(item.product_status)}` : ''].filter(Boolean).join(' · '); const conflicts = (item.conflict_candidates || []).length ? `<div>互斥候选：${(item.conflict_candidates || []).map(esc).join(', ')}</div>` : ''; return `<div class="technology-row" data-testid="technology" data-product="${esc(item.product_key || '')}"><strong>${esc(item.display_name || item.product_key)}</strong><div>${metadata || '已识别'}${conflicts}</div></div>`; };
	        const technologies = port => { const grouped = {}; (port.technologies || []).forEach(item => { const role = item.role || 'application'; (grouped[role] ||= []).push(item); }); const rows = Object.entries(grouped).map(([role, items]) => `<div class="endpoint-section"><h3>${esc(roleLabels[role] || role)}</h3><div class="technology-list">${items.map(technology).join('')}</div></div>`).join(''); return rows || '<p class="section-note">尚未识别详细技术栈。</p>'; };
	        const validation = port => { const value = port.validation || {}, endpoints = port.endpoint_validations || [], findings = value.findings || [], unmapped = value.unmapped_products || []; const coverage = `汇总 ${esc(value.status || 'unavailable')} · 识别产品 ${Number(value.identified_product_count || 0)} · 已映射 ${Number(value.mapped_product_count || 0)} · 候选模板 ${Number(value.candidate_template_count || 0)} · 已执行模板 ${Number(value.executed_template_count || 0)} · 漏洞 ${Number(value.finding_count || 0)}`; const endpointRows = endpoints.map(item => `<div data-testid="endpoint-validation" data-protocol="${esc(item.protocol || '')}" data-status="${esc(item.status || 'unavailable')}" data-reason="${esc(item.reason || '')}" data-candidates="${Number(item.candidate_template_count || 0)}" data-executed="${Number(item.executed_template_count || 0)}" data-findings="${Number(item.finding_count || 0)}">${String(item.protocol || '').toUpperCase()} · ${esc(item.status || 'unavailable')}${item.reason ? ` · ${esc(item.reason)}` : ''} · 候选 ${Number(item.candidate_template_count || 0)} / 执行 ${Number(item.executed_template_count || 0)} / 漏洞 ${Number(item.finding_count || 0)}</div>`).join(''); const results = findings.map(item => `<div data-testid="vulnerability-finding" data-template="${esc(item.template_id || '')}"><strong>${esc(item.severity || 'unknown')} · ${esc(item.name || item.template_id || item.finding_key)}</strong><br>${esc(item.matched_at || item.target || '')}${item.description ? `<br>${esc(item.description)}` : ''}</div>`).join(''); return `<div class="endpoint-section"><h3>漏洞验证</h3><div>${coverage}${value.reason ? ` · ${esc(value.reason)}` : ''}</div>${endpointRows ? `<div class="validation-endpoints">${endpointRows}</div>` : ''}${unmapped.length ? `<div class="section-note">未映射：${unmapped.map(esc).join(', ')}</div>` : ''}${results ? `<div class="finding-list">${results}</div>` : ''}</div>`; };
	        const endpoint = port => `<section class="endpoint-profile" data-testid="endpoint-profile" data-port="${Number(port.port || 0)}"><div class="endpoint-heading"><strong>${esc(asset.host.ip)}:${port.port}/${esc(port.transport || 'tcp')}</strong><span>${esc(port.service || 'unknown')} · ${esc(port.state || 'open')} · 运行 #${Number(port.observation_run_id || 0)}</span></div><div class="endpoint-body"><div class="endpoint-section"><h3>协议响应</h3><div class="endpoint-evidence">${response(port)}</div></div>${technologies(port)}${validation(port)}${(port.unresolved_reasons || []).length ? `<div class="endpoint-section"><h3>无结果原因</h3><ul class="reason-list">${port.unresolved_reasons.map(reason => `<li>${esc(reason)}</li>`).join('')}</ul></div>` : ''}</div></section>`;
        host.innerHTML = `<dl><dt>IP</dt><dd>${esc(asset.host.ip)}</dd><dt>扫描范围</dt><dd>${Number(asset.host.scope_count || 0)} 个</dd><dt>状态</dt><dd>${status(asset.host.is_active ? 'success' : 'inactive')}</dd></dl><div class="table-wrap"><table><thead><tr><th>范围</th><th>状态</th><th>首次发现</th><th>最后发现</th><th>最近检查</th></tr></thead><tbody>${(asset.scopes || []).map(scope => `<tr><td>${esc(scope.scope)}</td><td>${status(scope.is_active ? 'success' : 'inactive')}</td><td>${time(scope.first_seen)}</td><td>${time(scope.last_seen)}</td><td>${time(scope.last_checked)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">暂无范围成员</td></tr>'}</tbody></table></div><div class="asset-endpoints">${asset.ports.map(endpoint).join('') || '<div class="empty">暂无端口结果</div>'}</div>`;
      } catch (error) { message(error.message, true); }
    }
		    const reportSelection = {tasks: [], runs: [], taskID: '', runID: '', mode: 'user', epoch: 0, loadSerial: 0};
	    function reportTaskMatches(task, query) { return [`#${task.id}`, task.id, task.target, task.scan_type, task.mode, task.status].join(' ').toLowerCase().includes(query); }
	    function reportRunMatches(run, query) { return [`#${run.sequence}`, run.sequence, run.id, run.status, run.stage, run.trigger].join(' ').toLowerCase().includes(query); }
	    function renderReportTaskResults() {
	      const host = document.getElementById('report-task-results'), input = document.getElementById('report-task-search'); if (!host || !input) return;
	      const query = input.value.trim().toLowerCase(), matches = reportSelection.tasks.filter(task => reportTaskMatches(task, query)).slice(0, 20);
	      host.innerHTML = matches.map(task => `<button type="button" class="picker-option${String(task.id) === reportSelection.taskID ? ' selected' : ''}" data-report-task="${task.id}"><strong>#${task.id} · ${esc(task.target)}</strong><span>${esc(task.scan_type)} · ${esc(task.mode)} · ${esc(task.status)} · 更新 ${time(task.updated_at || task.created_at)}</span></button>`).join('') || '<div class="empty">无匹配任务</div>';
	      host.querySelectorAll('[data-report-task]').forEach(button => button.onclick = () => selectReportTask(button.dataset.reportTask));
	    }
	    function renderReportRunResults() {
	      const host = document.getElementById('report-run-results'), input = document.getElementById('report-run-search'); if (!host || !input) return;
	      const query = input.value.trim().toLowerCase(), matches = reportSelection.runs.filter(run => reportRunMatches(run, query)).slice(0, 20);
	      host.innerHTML = matches.map(run => `<button type="button" class="picker-option${String(run.id) === reportSelection.runID ? ' selected' : ''}" data-report-run="${run.id}"><strong>#${run.sequence} · ${esc(run.status)} · ${esc(run.stage || 'queued')}</strong><span>${esc(run.trigger || '-')} · ${time(run.finished_at || run.scheduled_for)}</span></button>`).join('') || '<div class="empty">无匹配运行</div>';
	      host.querySelectorAll('[data-report-run]').forEach(button => button.onclick = () => selectReportRun(button.dataset.reportRun));
	    }
	    function updateReportSelections() {
	      const task = reportSelection.tasks.find(item => String(item.id) === reportSelection.taskID), run = reportSelection.runs.find(item => String(item.id) === reportSelection.runID);
	      const taskHost = document.getElementById('report-task-selection'), runHost = document.getElementById('report-run-selection');
	      if (taskHost) taskHost.textContent = task ? `已选 #${task.id} · ${task.target} · ${task.status}` : '尚未选择任务';
	      if (runHost) runHost.textContent = run ? `已选 #${run.sequence} · ${run.status} · ${run.stage || 'queued'}` : '尚未选择运行';
	      document.querySelectorAll('[data-report-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.reportMode === reportSelection.mode)));
	      renderReportTaskResults(); renderReportRunResults();
	    }
		    async function selectReportTask(taskID) {
		      reportSelection.loadSerial++; reportSelection.taskID = String(taskID); reportSelection.runID = ''; reportSelection.runs = []; const epoch = ++reportSelection.epoch;
	      updateReportSelections(); setMarkdownReport('正在加载运行记录...');
	      try {
	        const runs = await request(`/api/scan-tasks/${taskID}/runs`);
	        if (epoch !== reportSelection.epoch || reportSelection.taskID !== String(taskID)) return;
	        reportSelection.runs = runs.slice().sort((left, right) => Number(right.sequence) - Number(left.sequence));
	        reportSelection.runID = reportSelection.runs.length ? String(reportSelection.runs[0].id) : '';
	        updateReportSelections();
	        if (reportSelection.runID) loadReport(); else { setMarkdownReport('暂无运行记录。'); document.getElementById('finding-list').innerHTML = '<div class="empty">暂无漏洞结果</div>'; }
	      } catch (error) { if (epoch === reportSelection.epoch) setMarkdownReport(`报告不可用\n\n${error.message}`); }
	    }
		    function selectReportRun(runID) { reportSelection.loadSerial++; reportSelection.runID = String(runID); updateReportSelections(); loadReport(); }
		    function setReportMode(mode) { reportSelection.loadSerial++; reportSelection.mode = mode === 'audit' ? 'audit' : 'user'; updateReportSelections(); if (reportSelection.runID) loadReport(); }
	    async function renderReports() {
      shell('漏洞与报告', '查看任务变化、漏洞结果和 Markdown 报告', '<div class="empty">正在加载任务...</div>');
      try {
        const tasks = await request('/api/scan-tasks');
		        reportSelection.tasks = tasks; reportSelection.runs = []; reportSelection.taskID = ''; reportSelection.runID = ''; reportSelection.mode = 'user'; reportSelection.epoch++; reportSelection.loadSerial++;
	        shell('漏洞与报告', '查看逻辑任务各轮的验证状态、漏洞结果和报告', `<section class="panel"><div class="panel-heading report-toolbar"><h2>报告选择</h2><div class="report-picker-grid"><div class="search-picker"><label>搜索任务<input id="report-task-search" type="search" placeholder="编号、目标、类型或状态"></label><div class="picker-selection" id="report-task-selection">尚未选择任务</div><div class="picker-results" id="report-task-results"></div></div><div class="search-picker"><label>搜索运行<input id="report-run-search" type="search" placeholder="序号或状态"></label><div class="picker-selection" id="report-run-selection">尚未选择运行</div><div class="picker-results" id="report-run-results"></div></div></div></div></section><div class="report-grid" style="margin-top:20px"><section class="panel"><div class="panel-heading"><h2>报告内容</h2><div class="report-mode" role="group" aria-label="报告类型"><button type="button" class="button secondary" data-report-mode="user" aria-pressed="true">用户报告</button><button type="button" class="button secondary" data-report-mode="audit" aria-pressed="false">审计报告</button></div></div><div class="markdown" id="markdown-report">选择运行查看报告。</div></section><section class="panel"><div class="panel-heading"><h2>本轮漏洞结果</h2></div><div class="panel-body" id="finding-list"></div></section></div>`);
	        document.getElementById('report-task-search').oninput = renderReportTaskResults;
	        document.getElementById('report-run-search').oninput = renderReportRunResults;
	        document.querySelectorAll('[data-report-mode]').forEach(button => button.onclick = () => setReportMode(button.dataset.reportMode));
	        updateReportSelections();
	        if (tasks.length) selectReportTask(tasks[0].id); else { setMarkdownReport('暂无任务。'); document.getElementById('finding-list').innerHTML = '<div class="empty">暂无漏洞结果</div>'; }
      } catch (error) { shell('漏洞与报告', '查看任务变化、漏洞结果和 Markdown 报告', `<div class="empty">${esc(error.message)}</div>`); }
    }
		    async function loadReport() {
		      const taskID = reportSelection.taskID, runID = reportSelection.runID, mode = reportSelection.mode, epoch = reportSelection.epoch, loadSerial = ++reportSelection.loadSerial;
		      const isCurrent = () => loadSerial === reportSelection.loadSerial && epoch === reportSelection.epoch && taskID === reportSelection.taskID && runID === reportSelection.runID && mode === reportSelection.mode;
		      const findings = document.getElementById('finding-list'); if (!taskID || !runID || !findings) return; setMarkdownReport('正在加载...'); findings.innerHTML = '';
		      const suffix = mode === 'audit' ? 'audit-report' : 'report';
		      try { const content = await request(`/api/scan-tasks/${taskID}/runs/${runID}/${suffix}`); if (isCurrent()) setMarkdownReport(content); } catch (error) { if (isCurrent()) setMarkdownReport(`${mode === 'audit' ? '审计报告' : '报告'}不可用\n\n${error.message}`); }
	      try {
	        const result = await request(`/api/scan-tasks/${taskID}/runs/${runID}/findings?page=1&page_size=100`); const validation = result.validation || {};
		        if (!isCurrent()) return;
	        const labels = {disabled:'未启用漏洞验证', not_started:'漏洞验证尚未开始', no_candidates:'无可用端点或模板', success:result.total ? '已发现漏洞' : '验证成功，未发现漏洞', failed:'漏洞验证失败'};
        findings.innerHTML = `<dl><dt>验证状态</dt><dd>${status(validation.status || 'unavailable')} · ${esc(labels[validation.status] || '状态不可用')}</dd><dt>覆盖</dt><dd>${validation.executed_endpoint_count || 0} / ${validation.candidate_endpoint_count || 0} 个端点 · ${validation.template_count || 0} 个模板</dd><dt>发现</dt><dd>${result.total || 0}</dd>${validation.error ? `<dt>错误</dt><dd>${esc(validation.error)}</dd>` : ''}</dl>${(result.items || []).map(item => `<section class="change-group"><h3>${esc(item.name || item.template_id || '未命名漏洞')}</h3><p>${status(item.severity || 'unknown')} · ${esc(item.target)}</p><p class="section-note">${esc(item.template_id || '-')} · ${esc(item.matched_at || '-')}</p>${item.description ? `<p>${esc(item.description)}</p>` : ''}</section>`).join('') || ''}`;
	      } catch (error) { if (isCurrent()) findings.innerHTML = `<div class="empty">${esc(error.message)}</div>`; }
	    }
			    function route() { clearTimeout(routeRefreshTimer); selectedScanTaskID = ''; scanTaskDetailEpoch++; runDetailLoadSerial++; scanTaskDetailRefreshFailed = false; reportSelection.epoch++; reportSelection.loadSerial++; ({'/assets':renderAssets, '/fingerprints':renderFingerprints, '/reports':renderReports, '/executions':renderImmediateExecutions, '/tasks':renderScanTasks}[location.pathname] || renderScanTasks)(); }
    document.addEventListener('click', event => { const link = event.target.closest('a[data-route]'); if (link) { event.preventDefault(); history.pushState({}, '', link.href); route(); } });
    window.addEventListener('popstate', route); route();
  </script>
